<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ttdequin.com</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: clamp(8px, 2vh, 20px);
    }

    .logo {
      max-width: 94vw;

      /* réserve automatiquement la place pour le texte */
      max-height: calc(100vh - 90px);

      width: auto;
      height: auto;
      object-fit: contain;
      min-height: 0;
    }

    .welcome {
      text-align: center;
      color: #666;

      font-size: clamp(12px, 1.8vw, 16px);
      line-height: 1.4;

      margin-top: clamp(4px, 1vh, 12px);
      flex-shrink: 0;
    }
  </style>
</head>

<body>

  <img src="TT_Mascot.png"
       alt="ttdequin.com logo"
       class="logo">

  <div class="welcome">
    Bienvenue - 歡迎來到 - Welcome<br>
    Website of T&T Dequin Services LLC, Texas.
  </div>

</body>
</html>
